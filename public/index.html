<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ Salesforce ORG Scanner | Next-Gen Security Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0c12 0%, #03050a 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #eef5ff;
        }

        /* Animated glassmorphic container */
        .glass-panel {
            max-width: 1400px;
            margin: 0 auto;
            backdrop-filter: blur(2px);
            border-radius: 2.5rem;
            position: relative;
        }

        /* header nebula effect */
        .scanner-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 1.5rem;
        }

        .title-section h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #C0F2FF 0%, #3B82F6 60%, #00E0FF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }

        .title-section h1 i {
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #3b82f6;
            font-size: 2.4rem;
            text-shadow: 0 0 10px #00a6ff;
        }

        .badge-conn {
            background: rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(52, 211, 153, 0.5);
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6ee7b7;
        }

        .badge-conn i {
            font-size: 0.9rem;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; text-shadow: 0 0 0px #2ecc71; }
            100% { opacity: 1; text-shadow: 0 0 6px #2ecc71; }
        }

        /* scan card */
        .scan-card {
            background: rgba(12, 18, 28, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 2rem;
            margin-bottom: 2.5rem;
            transition: all 0.2s;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }

        .search-field {
            flex: 4;
            min-width: 220px;
            background: #0b1018;
            border: 1.5px solid #2d3a51;
            border-radius: 2rem;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            color: #ffffff;
            font-weight: 500;
            transition: all 0.25s;
            font-family: 'Inter', monospace;
        }

        .search-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
            background: #0a0f18;
        }

        .scan-btn {
            flex: 1;
            background: linear-gradient(95deg, #1e2a4a, #0f172a);
            border: 1px solid #3b82f6;
            padding: 0.9rem 1.8rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #e0f2fe;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }

        .scan-btn i {
            font-size: 1.2rem;
        }

        .scan-btn:hover {
            background: linear-gradient(95deg, #2c3c64, #1e2a44);
            border-color: #60a5fa;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0, 100, 255, 0.3);
        }

        .scan-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
            filter: grayscale(0.1);
        }

        .loader-matrix {
            display: none;
            margin: 1.5rem 0 0.5rem;
            background: rgba(0, 20, 40, 0.7);
            border-left: 4px solid #00e0ff;
            padding: 1rem 1.3rem;
            border-radius: 1.2rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            backdrop-filter: blur(4px);
            color: #9efff0;
            align-items: center;
            gap: 14px;
        }

        .loader-matrix i {
            font-size: 1.6rem;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }

        /* results headline */
        .results-header {
            margin: 1rem 0 1.6rem 0;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .match-counter {
            background: rgba(59,130,246,0.2);
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #3b82f6;
            backdrop-filter: blur(2px);
        }

        .grid-cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* modern ultraclean result tile */
        .result-tile {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 1rem 1.5rem;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .result-tile:hover {
            border-color: rgba(59, 130, 246, 0.7);
            background: rgba(8, 15, 28, 0.85);
            transform: translateX(5px);
            box-shadow: 0 12px 22px -10px rgba(0,0,0,0.5);
        }

        .tile-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 3;
        }

        .type-badge-modern {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0f212e;
            padding: 4px 14px;
            border-radius: 40px;
            width: fit-content;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7dd3fc;
            border: 0.5px solid #3b82f6;
        }

        .match-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f0f9ff;
            word-break: break-word;
        }

        .match-detail {
            font-size: 0.85rem;
            color: #94a3b8;
            font-family: 'SF Mono', monospace;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .open-link {
            background: rgba(59,130,246,0.15);
            backdrop-filter: blur(5px);
            padding: 0.7rem 1.3rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #b9e2ff;
            border: 1px solid #3b82f6;
        }

        .open-link:hover {
            background: #2563eb;
            color: white;
            border-color: white;
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: rgba(255,255,255,0.02);
            border-radius: 2rem;
            border: 1px dashed #3b82f680;
        }

        .empty-state i {
            font-size: 3.2rem;
            margin-bottom: 1rem;
            color: #2c6e9e;
        }

        @media (max-width: 760px) {
            body { padding: 1rem; }
            .title-section h1 { font-size: 1.8rem; }
            .scan-card { padding: 1.3rem; }
            .result-tile { flex-direction: column; align-items: flex-start; }
        }

        .glow-text {
            text-shadow: 0 0 2px cyan;
        }

        .status-led {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px #2ecc71;
            animation: pulse-led 1.5s infinite;
        }
        @keyframes pulse-led {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="glass-panel">
    <div class="scanner-header">
        <div class="title-section">
            <h1>
                <i class="fas fa-shield-haltered"></i> 
                Salesforce ORG Scanner
            </h1>
            <div style="margin-top: 10px; font-size: 0.85rem; color: #87b9ff;">🔍 Next‑gen universal deep scan · Matrix-grade entropy</div>
        </div>
        <div class="badge-conn">
            <span class="status-led"></span>
            <i class="fas fa-plug"></i> 
            <span>local · AUTHORIZED</span>
            <i class="fas fa-bolt" style="margin-left: 6px;"></i>
        </div>
    </div>

    <div class="scan-card">
        <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 10px;">
            <i class="fas fa-microchip" style="color:#3b82f6; font-size: 1.4rem;"></i>
            <span style="font-weight: 500;">⚡ DEEP SCAN ENGINE</span>
        </div>
        <div class="input-group">
            <input type="text" id="searchInput" class="search-field" placeholder="Search..." autocomplete="off">
            <button id="scanBtn" class="scan-btn" onclick="triggerDeepScan()">
                <i class="fas fa-skull-crosswalk"></i> Deep Scan Org
            </button>
        </div>
        <div id="loader" class="loader-matrix">
            <i class="fas fa-cogs"></i> 
            <span>Hacking into the Salesforce Matrix... deep scanning Flows, Apex, Metadata & Records (approx 15-20s)</span>
        </div>
    </div>

    <div id="resultsArea" style="min-height: 200px;"></div>
    <footer>
        <i class="fas fa-lock"></i> zero-trust architecture · real-time org integrity <i class="fas fa-dragon"></i>
    </footer>
</div>

<script>
    let activeInstanceUrl = '';

    async function triggerDeepScan() {
        const term = document.getElementById('searchInput').value.trim();
        if (term.length < 2) {
            showToast('⚠️ Enter at least 2 characters to initiate deep scan', '#f97316');
            return;
        }

        const scanBtn = document.getElementById('scanBtn');
        const loaderDiv = document.getElementById('loader');
        const resultsDiv = document.getElementById('resultsArea');

        scanBtn.disabled = true;
        loaderDiv.style.display = 'flex';
        resultsDiv.innerHTML = '';

        try {
            const response = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ searchTerm: term })
            });

            const data = await response.json();
            loaderDiv.style.display = 'none';
            scanBtn.disabled = false;

            if (data.error) {
                resultsDiv.innerHTML = `
                    <div class="empty-state" style="border-color: #ff4d4d80;">
                        <i class="fas fa-radiation"></i>
                        <h3>Scan interceptor error</h3>
                        <p style="color:#ffaaaa;">${escapeHtml(data.error)}</p>
                    </div>`;
                return;
            }

            activeInstanceUrl = data.instanceUrl || '';
            const matches = data.matches || [];
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle" style="color:#2ecc71;"></i>
                        <h2 style="margin: 12px 0;">✅ ALL CLEAR</h2>
                        <p style="font-size: 1rem;">"${escapeHtml(term)}" not found anywhere — org is hardened.</p>
                        <div style="margin-top: 15px;"><i class="fas fa-shield-alt"></i> Zero matches across Apex, Flows, LWC & Records</div>
                    </div>`;
                return;
            }

            // Build state-of-the-art results grid
            let headerHtml = `
                <div class="results-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <i class="fas fa-terminal" style="font-size: 1.8rem; color:#38bdf8;"></i>
                        <h2 style="font-weight: 700;">🔍 Forensic matches</h2>
                    </div>
                    <div class="match-counter">
                        <i class="fas fa-bug"></i> ${matches.length} occurrence${matches.length > 1 ? 's' : ''} detected
                    </div>
                </div>
                <div class="grid-cards" id="matchList"></div>
            `;
            resultsDiv.innerHTML = headerHtml;
            
            const container = document.getElementById('matchList');
            matches.forEach(m => {
                const typeRaw = m.type || 'Unknown';
                const nameRaw = m.name || '—';
                const detailRaw = m.detail || '';
                let linkMarkup = '';
                if (m.link && activeInstanceUrl) {
                    const url = activeInstanceUrl + m.link;
                    linkMarkup = `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="open-link"><i class="fas fa-external-link-alt"></i> Open in Salesforce</a>`;
                } else if (m.link === undefined && m.type && (m.type.includes('Record') || m.type.includes('Schema'))) {
                    // maybe no direct link but we show minimal info
                } else if (m.link && !activeInstanceUrl) {
                    linkMarkup = `<span class="open-link" style="opacity:0.6; cursor:default;"><i class="fas fa-link"></i> relogin required</span>`;
                }
                
                // Enhanced type icons
                let icon = '<i class="fas fa-code-branch"></i>';
                if (typeRaw.includes('Flow')) icon = '<i class="fas fa-water"></i>';
                else if (typeRaw.includes('Apex')) icon = '<i class="fab fa-salesforce"></i>';
                else if (typeRaw.includes('LWC')) icon = '<i class="fas fa-bolt"></i>';
                else if (typeRaw.includes('Record')) icon = '<i class="fas fa-database"></i>';
                else if (typeRaw.includes('Schema')) icon = '<i class="fas fa-chart-line"></i>';
                else if (typeRaw.includes('Aura')) icon = '<i class="fas fa-magic"></i>';
                
                const tile = document.createElement('div');
                tile.className = 'result-tile';
                tile.innerHTML = `
                    <div class="tile-content">
                        <div class="type-badge-modern">
                            ${icon} ${escapeHtml(typeRaw)}
                        </div>
                        <div class="match-name">${escapeHtml(nameRaw)}</div>
                        <div class="match-detail">
                            <i class="fas fa-info-circle" style="font-size: 0.7rem;"></i> 
                            ${escapeHtml(detailRaw.length > 180 ? detailRaw.substring(0, 180) + '…' : detailRaw)}
                        </div>
                    </div>
                    <div>
                        ${linkMarkup || (m.link ? '' : '')}
                    </div>
                `;
                container.appendChild(tile);
            });
            
            // subtle highlight
            if(matches.some(m => m.type && m.type.includes('Record'))) {
                // just UX charm
            }
        } catch (err) {
            console.error(err);
            loaderDiv.style.display = 'none';
            scanBtn.disabled = false;
            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-skull"></i>
                    <h3>⚡ Connection failure</h3>
                    <p>Backend server not responding. Ensure node backend is running on port 3000.</p>
                    <button onclick="window.location.reload()" style="margin-top: 15px; background:#1e293b; border:none; padding:8px 22px; border-radius:28px; color:white; cursor:pointer;">⟳ retry</button>
                </div>`;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    function showToast(msg, color) {
        const toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '20px';
        toast.style.background = '#111c2d';
        toast.style.borderLeft = `4px solid ${color || '#3b82f6'}`;
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '40px';
        toast.style.zIndex = '9999';
        toast.style.backdropFilter = 'blur(12px)';
        toast.style.fontWeight = '500';
        toast.style.boxShadow = '0 4px 15px rgba(0,0,0,0.4)';
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 2800);
    }
    
    // allow pressing Enter key to trigger scan
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            triggerDeepScan();
        }
    });
    
   // Check Authentication on Page Load
    window.addEventListener('DOMContentLoaded', async () => {
        const welcomeDiv = document.getElementById('resultsArea');
        const scanCard = document.querySelector('.scan-card');
        const badgeConn = document.querySelector('.badge-conn');

        try {
            const response = await fetch('/api/checkAuth');
            const authData = await response.json();

            if (authData.loggedIn) {
                // User is logged in! Show the scanner
                scanCard.style.display = 'block';
                activeInstanceUrl = authData.instanceUrl;
                
                badgeConn.innerHTML = `
                    <span class="status-led"></span>
                    <i class="fas fa-plug"></i> 
                    <span>CONNECTED: ${authData.instanceUrl.split('//')[1].split('.')[0]}</span>
                    <a href="/auth/logout" style="color: #ff4d4d; text-decoration: none; margin-left: 10px; font-weight: bold;">[Logout]</a>
                `;

                welcomeDiv.innerHTML = `
                    <div class="empty-state" style="border-color: #2c3e66;">
                        <i class="fas fa-radar" style="font-size: 3rem; color:#3b82f6;"></i>
                        <h3 style="margin: 15px 0 8px;">🚀 Ready for deep reconnaissance</h3>
                        <p>Enter any text, ID, variable, Flow outcome message, or record name to begin the scan.</p>
                    </div>
                `;
            } else {
                // User is NOT logged in! Hide scanner, show login button
                scanCard.style.display = 'none';
                badgeConn.innerHTML = `<span style="color: #ff4d4d;"><i class="fas fa-times-circle"></i> Not Connected</span>`;
                
                welcomeDiv.innerHTML = `
                    <div class="empty-state" style="border-color: #ff4d4d80;">
                        <i class="fab fa-salesforce" style="font-size: 4rem; color:#00a1e0;"></i>
                        <h2 style="margin: 20px 0 10px;">Connect Your Salesforce Org</h2>
                        <p style="margin-bottom: 25px; color: #a0aec0;">Authorize the Next-Gen Scanner to perform forensic analysis on your org.</p>
                        <a href="/auth/login" style="background: #0176d3; color: white; padding: 12px 30px; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 1.1rem; transition: 0.2s; box-shadow: 0 4px 15px rgba(1, 118, 211, 0.4);">
                            <i class="fas fa-key"></i> Login with Salesforce
                        </a>
                    </div>
                `;
            }
        } catch (err) {
            console.error("Auth check failed:", err);
        }
    });
</script>
</body>
</html>
